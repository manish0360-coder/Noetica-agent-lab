[pytest]
# Platform test suite only. Reference code (reference/) is NOT executable platform
# code and is excluded here and enforced by tools/check_boundaries.py (Constitution
# Law 4/9, §11.9, D11).
testpaths = tests
norecursedirs = reference .git __pycache__ *.egg build dist
markers =
    live: tests that call the real model (deselect with -m "not live")
